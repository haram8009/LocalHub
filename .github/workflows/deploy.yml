name: Build and deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: gradle }
      - name: Backend tests (MySQL)
        working-directory: backend
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: "3306"
          TEST_DB_USERNAME: root
          TEST_DB_PASSWORD: root
        run: sh gradlew --no-daemon test
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Frontend tests
        working-directory: frontend
        run: npm ci && npm run test:unit -- --run

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: app
            file: deploy/app.Dockerfile
          - name: db
            file: deploy/db.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with: { platforms: arm64 }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (lowercase)
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}-${{ matrix.name }}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          build-args: |
            VITE_KAKAO_MAP_JAVASCRIPT_KEY=${{ vars.VITE_KAKAO_MAP_JAVASCRIPT_KEY }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          SSH_HOST: ${{ secrets.OCI_HOST }}
          SSH_USER: ${{ secrets.OCI_USER }}
        run: |
          install -m 700 -d ~/.ssh
          # 줄바꿈(CRLF) 제거, 마지막 개행 보장
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # 키 형식이 올바른지, 암호가 걸려 있지 않은지 확인 (공개키 지문만 출력)
          ssh-keygen -y -P "" -f ~/.ssh/id_deploy > /tmp/deploy_key.pub \
            || { echo "::error::OCI_SSH_KEY 가 올바른 암호 없는 개인키가 아닙니다 (BEGIN/END 줄 포함 전체를 붙여넣었는지 확인)"; exit 1; }
          echo "Deploy key fingerprint (서버 authorized_keys 의 공개키와 같아야 함):"
          ssh-keygen -lf /tmp/deploy_key.pub
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          # 접속 테스트: 실패하면 사용자명/공개키 등록 문제
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" "echo ssh ok: \$(whoami)@\$(hostname)" \
            || { echo "::error::SSH 접속 실패: OCI_USER($SSH_USER) 와 서버 ~/.ssh/authorized_keys 의 공개키를 확인하세요"; exit 1; }
      - name: Copy deploy files
        run: |
          H="${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }}"
          ssh -i ~/.ssh/id_deploy "$H" "mkdir -p ~/enjoytrip"
          scp -i ~/.ssh/id_deploy docker-compose.yml deploy/Caddyfile deploy/deploy.sh deploy/rollback.sh deploy/lib.sh "$H:~/enjoytrip/"
          # 모니터링 설정(선택 프로필). 켜져 있지 않으면 쓰이지 않습니다.
          scp -r -i ~/.ssh/id_deploy monitoring "$H:~/enjoytrip/"
      - name: Blue/green deploy
        env:
          TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }}" \
            "TAG='$TAG' GHCR_USER='$GHCR_USER' GHCR_TOKEN='$GHCR_TOKEN' bash -s" <<'REMOTE'
          set -euo pipefail
          cd ~/enjoytrip
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          # 새 색에 띄우고 헬스체크·스모크 테스트를 통과해야만 전환합니다. 실패하면 기존 버전이 그대로 서비스됩니다.
          bash deploy.sh "$TAG"
          docker logout ghcr.io
          docker image prune -f >/dev/null
          REMOTE
