spring:
  sql:
    init:
      schema-locations: classpath:db/schema-mysql.sql
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ssafy_trip?connectionTimeZone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
app:
  tour-source: database
