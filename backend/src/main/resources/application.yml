server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
spring:
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:./backend/.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/enjoytrip;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
    default: local
app:
  tour-source: ${TOUR_SOURCE:api}
  tour-key: ${TOUR_API_KEY:}
  kakao-key: ${KAKAO_REST_API_KEY:}
  seed-demo: ${SEED_DEMO:true}
