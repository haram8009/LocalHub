server:
  port: 8080
spring:
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:./backend/.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/enjoytrip;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    # db/migration/mysql, db/migration/h2 (DB 종류별 SQL)
    locations: classpath:db/migration/{vendor}
    # 관광지 테이블만 있고 Flyway 이력이 없는 기존 DB도 V1(IF NOT EXISTS)을 적용해 이어받습니다.
    baseline-on-migrate: true
    baseline-version: 0
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
    default: local
app:
  tour-source: ${TOUR_SOURCE:api}
  tour-key: ${TOUR_API_KEY:}
  kakao-key: ${KAKAO_REST_API_KEY:}
  seed-demo: ${SEED_DEMO:true}
  jwt:
    # 32바이트 이상. 비워 두면 기동 시마다 임의 키를 생성하므로 재시작하면 기존 토큰이 무효화됩니다.
    secret: ${JWT_SECRET:}
    access-expiry-seconds: ${JWT_ACCESS_EXPIRY_SECONDS:1800}
    refresh-expiry-seconds: ${JWT_REFRESH_EXPIRY_SECONDS:1209600}
    # HTTPS 배포에서는 true로 설정하세요.
    cookie-secure: ${JWT_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

mybatis:
  mapper-locations: classpath:mappers/*.xml
  configuration:
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true
    local-cache-scope: STATEMENT
