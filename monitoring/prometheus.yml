# Docker 내부 네트워크에서 서비스 이름으로 수집합니다.
# 쉬고 있는(정지된) 색은 up=0 으로 보이며, 그래프에서 어느 색이 살아 있는지 확인하는 데 씁니다.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [backend-blue:8080]
        labels: { instance: blue }
      - targets: [backend-green:8080]
        labels: { instance: green }

  - job_name: caddy
    static_configs:
      - targets: [proxy:2020]

  - job_name: mysql
    static_configs:
      - targets: [mysqld-exporter:9104]

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
