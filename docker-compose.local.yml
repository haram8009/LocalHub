# 로컬 검증용 오버라이드. 백엔드 이미지는 미리 빌드해 둔 태그를 쓰고(docs/DEPLOYMENT.md 참고),
# MySQL 이미지는 소스에서 빌드하며, 프록시는 HTTP(8081)로 접속합니다.
#   export COMPOSE_FILE=docker-compose.yml:docker-compose.local.yml COMPOSE_ENV_FILES=deploy/local.env
services:
  db:
    build:
      context: .
      dockerfile: deploy/db.Dockerfile
  proxy:
    ports: !override
      - "8081:80"
    volumes: !override
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./upstream:/etc/caddy/upstream:ro
      - caddy_data:/data
      - caddy_config:/config
