# 운영용 Compose (블루그린). 서버에는 이 파일, Caddyfile, deploy.sh, rollback.sh, .env 가 있으면 됩니다.
# 배포/롤백은 직접 compose 를 호출하지 말고 ./deploy.sh, ./rollback.sh 를 사용하세요.
# 로컬 검증: docker compose -f docker-compose.yml -f docker-compose.local.yml --env-file deploy/local.env ...
name: enjoytrip

# 블루/그린 백엔드 공통 설정 (프론트가 jar 안에 들어 있어 화면과 API 가 한 단위로 배포됩니다)
x-backend: &backend
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  environment: &backend-env
    SPRING_PROFILES_ACTIVE: mysql
    DB_URL: jdbc:mysql://db:3306/ssafy_trip?connectionTimeZone=Asia/Seoul&characterEncoding=UTF-8
    DB_USERNAME: ${DB_USERNAME:-ssafy}
    DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    # 두 색이 같은 키를 써야 전환해도 로그인이 유지됩니다.
    JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (32+ bytes)}
    JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-true}
    KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
    SEED_DEMO: ${SEED_DEMO:-false}
    JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError}
    TZ: Asia/Seoul
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 6
    start_period: 40s

services:
  db:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX is required}-db:${DB_TAG:-latest}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ssafy_trip
      MYSQL_USER: ${DB_USERNAME:-ssafy}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: Asia/Seoul
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      # 첫 기동에는 관광지 덤프 적재로 1~3분이 걸립니다.
      start_period: 180s

  backend-blue:
    <<: *backend
    image: ${IMAGE_PREFIX}-app:${BLUE_TAG:-latest}
    environment:
      <<: *backend-env
      DEPLOY_COLOR: blue   # 지표 라벨(color)

  backend-green:
    <<: *backend
    image: ${IMAGE_PREFIX}-app:${GREEN_TAG:-latest}
    environment:
      <<: *backend-env
      DEPLOY_COLOR: green

  # TLS 종단과 리버스 프록시. 활성 색은 ./upstream/active.caddy 가 가리키며,
  # 컨테이너를 재시작하지 않고 `caddy reload`(연결 유지)로 전환합니다.
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS is required (domain, or :80 for local)}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./upstream:/etc/caddy/upstream:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      # Caddy 관리 API(컨테이너 내부 전용)로 상태를 확인합니다.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # 컨테이너 로그를 실시간으로 보는 웹 UI. 로컬호스트에만 열려 있으므로 SSH 터널로 접속하세요.
  #   ssh -L 8888:127.0.0.1:8888 <user>@<server>  →  http://localhost:8888
  dozzle:
    image: amir20/dozzle:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # ── 모니터링 (선택) ─────────────────────────────────────────────
  # 기본 배포에는 포함되지 않습니다. 켜기: docker compose --profile monitoring up -d
  # Grafana: ssh -L 3000:127.0.0.1:3000 <user>@<server>  →  http://localhost:3000
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      # k6 결과를 받기 위한 remote write 수신
      - --web.enable-remote-write-receiver
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:12.1.1
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      # 127.0.0.1 에만 열리지만 서버에서는 .env 에 꼭 바꿔 두세요. (필수(:?)로 두면 모니터링을 안 켜는 배포까지 막힙니다)
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus]

  # MySQL 지표(커넥션, 쿼리 수, 잠금 대기, 버퍼 풀). PROCESS 권한이 필요해 root 로 접속합니다.
  # 포트를 외부에 열지 않으며 Prometheus 만 내부 네트워크로 읽습니다.
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.17.2
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - --mysqld.address=db:3306
      - --mysqld.username=root
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${DB_ROOT_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
